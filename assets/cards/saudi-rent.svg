  <text x="32" y="50" font-size="13" font-weight="700" fill="#D9669A" letter-spacing="2.5">PROJECT 01</text>
  <text x="32" y="92" font-size="34" font-weight="800" fill="#3F3557" letter-spacing="-.5">Saudi Rent Analysis</text>
  <text x="32" y="128" font-size="16" fill="#6B5E86">What makes rent expensive in Saudi cities?</text>

<svg xmlns="http://www.w3.org/2000/svg" width="600" height="340" viewBox="0 0 600 340">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#FFEBDD"/><stop offset="1" stop-color="#FFDCC6"/>
  </linearGradient>
  <clipPath id="r"><rect width="600" height="340" rx="24"/></clipPath>
</defs>
<style>
  .float { animation: f 6s ease-in-out infinite; }
  @keyframes f { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
  .pulse { animation: p 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes p { 0%,100% { opacity:.55; } 50% { opacity:1; } }
  .draw { stroke-dasharray: 900; animation: d 3s ease-out both; }
  @keyframes d { from { stroke-dashoffset: 900; } to { stroke-dashoffset: 0; } }
</style>
<g clip-path="url(#r)" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <rect width="600" height="340" fill="url(#bg)"/>
  <circle cx="540" cy="40" r="110" fill="#FFFFFF" opacity=".28"/>
  <g class="float"><g transform="translate(395,70)">
  <rect x="0" y="0" width="160" height="160" rx="18" fill="#FFFFFF" opacity=".55"/>
  <path d="M10,10 L40,10 M10,10 L10,40 M150,10 L120,10 M150,10 L150,40 M10,150 L40,150 M10,150 L10,120 M150,150 L120,150 M150,150 L150,120"
        stroke="#E8846B" stroke-width="4" stroke-linecap="round"/>
  <g class="pulse">
    <path d="M80,28 C96,52 118,64 112,100 C108,124 92,136 80,136 C62,136 46,122 46,100 C46,82 58,72 62,58 C70,70 72,78 78,82 C82,66 78,44 80,28Z" fill="#F6B38A"/>
    <path d="M80,72 C88,86 98,94 96,110 C94,124 86,130 80,130 C70,130 62,122 62,110 C62,98 72,94 74,84 C77,92 79,94 80,96 C82,88 80,80 80,72Z" fill="#FFE7A6"/>
  </g>
  <rect x="96" y="128" width="62" height="24" rx="12" fill="#E8846B"/>
  <text x="127" y="145" font-size="13" font-weight="800" fill="#FFFFFF" text-anchor="middle">FIRE</text>
</g></g>
  <text x="32" y="50" font-size="13" font-weight="700" fill="#D9704F" letter-spacing="2.5">PROJECT 04</text>
  <text x="32" y="92" font-size="34" font-weight="800" fill="#3F3557" letter-spacing="-.5">Fire Detection</text>
  <text x="32" y="128" font-size="16" fill="#6B5E86">Spots fire in images with transfer</text>
  <text x="32" y="150" font-size="16" fill="#6B5E86">learning on a ResNet-50 backbone.</text>
  <text x="32" y="222" font-size="46" font-weight="800" fill="#D9704F">95%+</text>
  <text x="32" y="250" font-size="14" font-weight="600" fill="#6B5E86">classification accuracy</text>
  <rect x="32" y="282" width="140" height="30" rx="15" fill="#FFFFFF" opacity=".75"/><text x="102" y="302" font-size="14" font-weight="600" fill="#3F3557" text-anchor="middle">Computer Vision</text><rect x="180.0" y="282" width="52" height="30" rx="15" fill="#FFFFFF" opacity=".75"/><text x="206" y="302" font-size="14" font-weight="600" fill="#3F3557" text-anchor="middle">CNN</text>
</g>
</svg>